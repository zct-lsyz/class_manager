{% extends "base.html" %}{% block title %}考勤原因项管理{% endblock %}{% block content %}<div class="d-flex justify-content-between align-items-center mt-3 mb-4"><h4 class="mb-0">考勤原因项管理</h4><a href="{% url 'attendance:index' %}" class="btn btn-outline-secondary btn-sm">返回考勤管理</a></div><div class="mb-3"><a href="{% url 'exports:option_template' 'attendance_reason' %}" class="btn btn-outline-success btn-sm">下载 Excel 模板</a><form method="post" enctype="multipart/form-data" action="{% url 'exports:option_import' 'attendance_reason' %}" class="d-inline-flex ms-2">{% csrf_token %}<input type="file" name="file" accept=".xlsx" class="form-control form-control-sm" required><button class="btn btn-success btn-sm ms-1 text-nowrap">批量导入</button></form></div><form method="post" class="card card-body mb-3">{% csrf_token %}<div class="input-group"><input name="name" class="form-control" placeholder="输入一个原因项" required><button class="btn btn-primary">单独添加</button></div></form><div class="card"><ul class="list-group list-group-flush">{% for item in items %}<li class="list-group-item d-flex justify-content-between">{{ item.name }}<form method="post" action="{% url 'attendance:reason_delete' item.pk %}" onsubmit="return confirm('删除该原因项？')">{% csrf_token %}<button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></li>{% empty %}<li class="list-group-item text-muted">暂无原因项</li>{% endfor %}</ul></div>{% endblock %}
