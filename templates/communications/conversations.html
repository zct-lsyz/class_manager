{% extends "base.html" %}{% block title %}学生谈话{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-chat-dots me-2 text-primary"></i>学生谈话</h4>
<a href="{% url 'communications:conversation_create' %}" class="btn btn-primary btn-sm mb-3"><i class="bi bi-plus-lg"></i> 新建</a>
<div class="card"><div class="card-body p-0 table-responsive"><table class="table mb-0"><thead><tr><th>日期</th><th>学生</th><th>原因</th><th>跟进</th><th>私密</th></tr></thead>
<tbody>{% for c in page_obj %}<tr><td>{{ c.date }}</td><td>{{ c.student.name }}</td><td>{{ c.reason|truncatechars:30 }}</td><td>{{ c.follow_up_date|default:"-" }}</td><td>{% if c.is_private %}<span class="text-warning">私密{% endif %}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
