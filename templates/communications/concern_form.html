{% extends "base.html" %}
{% block title %}{% if record %}更新{% else %}新建{% endif %}重点关注{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3"><div class="col-md-8">
<div class="card"><div class="card-header">{% if record %}更新重点关注{% else %}新建重点关注{% endif %}</div>
<div class="card-body">
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label small">{{ f.label }}</label>{{ f }}{% if f.errors %}<div class="text-danger small">{{ f.errors.0 }}</div>{% endif %}</div>{% endfor %}
<div class="d-flex justify-content-between"><a href="{% url 'communications:concerns' %}" class="btn btn-outline-secondary">返回</a><button class="btn btn-primary">保存</button></div>
</form></div></div>
</div></div>{% endblock %}
