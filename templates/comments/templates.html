{% extends "base.html" %}{% block title %}评语模板{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-file-text me-2 text-primary"></i>评语模板</h4>
<form method="post" class="card p-3 mb-3">{% csrf_token %}{% for f in form %}<div class="mb-2"><label class="form-label small">{{ f.label }}</label>{{ f }}</div>{% endfor %}<button class="btn btn-primary btn-sm">添加</button></form>
<table class="table table-hover"><thead><tr><th>标题</th><th>分类</th><th>启用</th></tr></thead>
<tbody>{% for t in templates %}<tr><td>{{ t.title }}</td><td>{{ t.get_category_display }}</td><td>{% if t.is_active %}<span class="text-success">是{% endif %}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table>
{% endblock %}
