{% extends "base.html" %}{% block title %}主题班会{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-people-fill me-2 text-primary"></i>主题班会</h4>
<a href="{% url 'activities:class_meeting_create' %}" class="btn btn-primary btn-sm mb-3"><i class="bi bi-plus-lg"></i> 新建</a>
<div class="card"><div class="card-body p-0 table-responsive"><table class="table mb-0"><thead><tr><th>主题</th><th>日期</th><th>主持人</th></tr></thead>
<tbody>{% for m in page_obj %}<tr><td>{{ m.topic }}</td><td>{{ m.date }}</td><td>{{ m.host|default:"-" }}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
