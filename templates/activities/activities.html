{% extends "base.html" %}{% block title %}文体活动{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-activity me-2 text-primary"></i>文体活动</h4>
<a href="{% url 'activities:activity_create' %}" class="btn btn-primary btn-sm mb-3"><i class="bi bi-plus-lg"></i> 新建</a>
<div class="card"><div class="card-body p-0 table-responsive"><table class="table mb-0"><thead><tr><th>名称</th><th>类型</th><th>日期</th><th>负责人</th><th>操作</th></tr></thead>
<tbody>{% for a in page_obj %}<tr><td>{{ a.name }}</td><td>{{ a.get_activity_type_display }}</td><td>{{ a.date|default:"-" }}</td><td>{{ a.person_in_charge|default:"-" }}</td><td><form method="post" action="{% url 'activities:activity_delete' a.pk %}" onsubmit="return confirm('确认移入回收站？')">{% csrf_token %}<button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form></td></tr>{% empty %}<tr><td colspan="5" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
