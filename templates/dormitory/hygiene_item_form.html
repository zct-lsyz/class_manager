{% extends "base.html" %}
{% block title %}编辑卫生项目{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h4 class="mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>编辑卫生项目</h4>
    <a href="{% url 'dormitory:hygiene_items' %}" class="btn btn-outline-secondary btn-sm">返回</a>
</div>
<form method="post" class="card p-4">
    {% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-primary">保存修改</button>
</form>
{% endblock %}
