{% extends "base.html" %}
{% block title %}登记宿舍纪律{% endblock %}
{% block content %}
<h4 class="mt-3 mb-4"><i class="bi bi-house-exclamation me-2 text-primary"></i>登记宿舍纪律</h4>
<div class="row justify-content-center"><div class="col-md-8">
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label small">{{ f.label }}</label>{{ f }}{% if f.errors %}<div class="text-danger small">{{ f.errors.0 }}</div>{% endif %}</div>{% endfor %}
<div class="d-flex justify-content-between"><a href="{% url 'dormitory:discipline' %}" class="btn btn-outline-secondary">返回</a><button class="btn btn-primary">保存</button></div>
</form></div></div>
</div></div>
{% endblock %}
