{% load static %}
{% if students_json %}{{ students_json|json_script:"chip-students-data" }}{% endif %}
{% if initial_selected %}{{ initial_selected|json_script:"chip-initial-data" }}{% endif %}
<div class="mb-3">
    <label class="form-label small">{{ field.label }}（可多选）</label>
    <div class="student-chip-select">
        <select id="studentPicker" class="form-select form-select-sm mb-1"></select>
        <div id="selectedStudents" class="d-flex flex-wrap gap-1 border rounded p-2">
            <span class="text-muted small">从下拉选择学生，可多选；点 ✕ 取消选中。</span>
        </div>
    </div>
    <input type="hidden" name="student_mode" id="studentMode" value="one">
    {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
</div>
<script src="{% static 'js/student-chip-select.js' %}"></script>
<script>
(function() {
    const el = document.getElementById('chip-students-data');
    if (!el) return;
    const students = JSON.parse(el.textContent);
    const initialEl = document.getElementById('chip-initial-data');
    initStudentChipSelect({
        pickerId: 'studentPicker',
        chipsId: 'selectedStudents',
        modeId: 'studentMode',
        studentsName: 'students',
        staticStudents: students,
        initialSelected: initialEl ? JSON.parse(initialEl.textContent) : [],
    });
})();
</script>
