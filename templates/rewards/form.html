{% extends "base.html" %}{% block title %}{{ title|default:"新增奖惩" }}{% endblock %}
{% block content %}<div class="row justify-content-center mt-3"><div class="col-md-6">
  <div class="card"><div class="card-header">{{ title|default:"新增奖惩" }}</div><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label small">{{ f.label }}</label>{{ f }}{% if f.errors %}<div class="text-danger small">{{ f.errors.0 }}</div>{% endif %}</div>{% endfor %}<a href="{% url 'rewards:index' %}" class="btn btn-outline-secondary">返回</a> <button class="btn btn-primary">保存</button></form></div></div>
</div></div>{% endblock %}
