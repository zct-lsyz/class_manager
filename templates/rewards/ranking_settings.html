{% extends "base.html" %}{% block title %}积分排名设置{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3"><div class="col-md-7">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0"><i class="bi bi-gear me-2 text-primary"></i>积分排名设置</h4>
    <a href="{% url 'rewards:points' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>返回积分排名</a>
  </div>
  <div class="card">
    <div class="card-header">选择参与总体积分排名的模块</div>
    <div class="card-body">
      <p class="text-muted small mb-3">
        勾选后，所选模块的加减分将汇总计入总体积分排名。未勾选的模块积分不计入排名，但仍会在积分明细中显示。
      </p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex flex-column gap-2">
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_reward" {% if setting.enable_reward %}checked{% endif %}> <span class="form-check-label">奖惩统计（奖励/违纪）</span></label>
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_classroom_discipline" {% if setting.enable_classroom_discipline %}checked{% endif %}> <span class="form-check-label">课堂纪律</span></label>
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_dorm_discipline" {% if setting.enable_dorm_discipline %}checked{% endif %}> <span class="form-check-label">宿舍纪律</span></label>
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_hygiene" {% if setting.enable_hygiene %}checked{% endif %}> <span class="form-check-label">宿舍卫生</span></label>
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_attendance" {% if setting.enable_attendance %}checked{% endif %}> <span class="form-check-label">考勤管理</span></label>
          <label class="form-check"><input class="form-check-input" type="checkbox" name="enable_homework" {% if setting.enable_homework %}checked{% endif %}> <span class="form-check-label">作业检查</span></label>
        </div>
        <div class="mt-3 d-flex justify-content-between">
          <a href="{% url 'rewards:points' %}" class="btn btn-outline-secondary">取消</a>
          <button class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存设置</button>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
