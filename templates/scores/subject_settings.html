{% extends "base.html" %}{% block title %}科目设置{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-book me-2 text-primary"></i>科目设置</h4>
<form method="post" class="card p-3 mb-3">{% csrf_token %}<div class="row g-2 align-items-end"><div class="col-md-4"><label class="form-label small">科目名称</label><input type="text" name="name" class="form-control" required></div><div class="col-md-4"><label class="form-label small">简称</label><input type="text" name="short_name" class="form-control"></div><div class="col-md-4"><button class="btn btn-primary w-100">添加</button></div></div></form>
<table class="table table-hover"><thead><tr><th>名称</th><th>简称</th><th>启用</th></tr></thead>
<tbody>{% for s in subjects %}<tr><td>{{ s.name }}</td><td>{{ s.short_name|default:"-" }}</td><td>{% if s.is_active %}<span class="text-success">启用{% endif %}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table>
{% endblock %}
