{% extends "base.html" %}
{% block title %}创建培优补差计划{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3"><div class="col-md-6">
<div class="card"><div class="card-header">创建培优补差计划</div>
<div class="card-body">
<form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label small">{{ f.label }}</label>{{ f }}{% if f.errors %}<div class="text-danger small">{{ f.errors.0 }}</div>{% endif %}</div>{% endfor %}
<div class="d-flex justify-content-between"><a href="{% url 'scores:support_list' %}" class="btn btn-outline-secondary">返回</a><button class="btn btn-primary">创建</button></div>
</form></div></div>
</div></div>{% endblock %}
