{% extends "base.html" %}{% block title %}{% if task %}编辑作业{% else %}新建作业{% endif %}{% endblock %}
{% block content %}<div class="row justify-content-center mt-3"><div class="col-md-8">
  <div class="card"><div class="card-header">{% if task %}编辑作业{% else %}新建作业{% endif %}</div><div class="card-body"><form method="post">{% csrf_token %}{% for f in form %}<div class="mb-3"><label class="form-label small">{{ f.label }}</label>{{ f }}</div>{% endfor %}<button class="btn btn-primary">{% if task %}保存修改{% else %}创建{% endif %}</button>{% if task %}<a href="{% url 'homework:task_detail' task.pk %}" class="btn btn-outline-secondary ms-2">返回</a>{% endif %}</form></div></div>
</div></div>{% endblock %}
