{% extends "base.html" %}{% block title %}作业检查{% endblock %}
{% block content %}<h4 class="mt-3 mb-4"><i class="bi bi-journal-text me-2 text-primary"></i>作业检查</h4>
<a href="{% url 'homework:task_create' %}" class="btn btn-primary btn-sm mb-3"><i class="bi bi-plus-lg"></i> 新建作业</a>
<div class="card"><div class="card-body p-0 table-responsive">
  <table class="table mb-0"><thead><tr><th>名称</th><th>科目</th><th>布置</th><th>截止</th><th>操作</th></tr></thead>
  <tbody>{% for t in page_obj %}<tr><td><a href="{% url 'homework:task_detail' t.pk %}">{{ t.title }}</a></td><td>{{ t.subject.name|default:"-" }}</td><td>{{ t.assigned_date }}</td><td>{{ t.due_date|default:"-" }}</td><td class="text-nowrap"><a href="{% url 'homework:task_detail' t.pk %}" class="btn btn-sm btn-outline-primary">详情</a> <a href="{% url 'homework:task_edit' t.pk %}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i> 修改</a> <form method="post" action="{% url 'homework:task_delete' t.pk %}" class="d-inline" onsubmit="return confirm('确认删除作业「{{ t.title }}」？其完成记录将一并删除。')">{% csrf_token %}<button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i> 删除</button></form></td></tr>{% empty %}<tr><td colspan="5" class="text-muted text-center">暂无</td></tr>{% endfor %}</tbody></table>
</div></div>{% endblock %}
