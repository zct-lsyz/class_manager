{% extends "base.html" %}
{% block title %}全量数据导出{% endblock %}
{% block content %}
<h4 class="mt-3 mb-4"><i class="bi bi-archive me-2 text-primary"></i>全量数据导出</h4>
<div class="card"><div class="card-body text-center py-5">
    <i class="bi bi-archive fs-1 text-primary"></i>
    <p class="mt-3">一键导出所有模块的全部数据（ZIP 打包，含清单文件）</p>
    <p class="text-muted small">包含：学生、家长、考勤、纪律、奖励、积分、成绩、评语、谈话、活动、宿舍、作业、座位、值日共 14 个模块</p>
    <a href="{% url 'exports:full_export' %}" class="btn btn-primary mt-2" onclick="return confirm('确认导出所有模块的全部数据？')">
        <i class="bi bi-archive me-1"></i>执行全量导出
    </a>
</div></div>
{% endblock %}
