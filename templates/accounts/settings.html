{% extends "base.html" %}
{% load static %}

{% block title %}账户与安全 - 班级教学管理平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h4 class="mb-0">
        <i class="bi bi-shield-lock me-2 text-primary"></i>账户与安全
    </h4>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-person me-2"></i>账户信息
            </div>
            <div class="card-body">
                <table class="table table-borderless">
                    <tr>
                        <td class="text-muted" style="width: 120px;">用户名</td>
                        <td><strong>{{ user.username }}</strong></td>
                    </tr>
                    <tr>
                        <td class="text-muted">最后登录</td>
                        <td>{{ user.last_login|date:"Y-m-d H:i:s"|default:"首次登录" }}</td>
                    </tr>
                    <tr>
                        <td class="text-muted">加入时间</td>
                        <td>{{ user.date_joined|date:"Y-m-d H:i:s" }}</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mb-4">
            <div class="card-header">
                <i class="bi bi-gear me-2"></i>安全操作
            </div>
            <div class="card-body">
                <div class="d-grid gap-3">
                    <a href="{% url 'accounts:password_change' %}" class="btn btn-outline-primary">
                        <i class="bi bi-key me-2"></i>修改密码
                    </a>
                    <a href="{% url 'accounts:username_change' %}" class="btn btn-outline-primary">
                        <i class="bi bi-person me-2"></i>修改用户名
                    </a>
                    <a href="{% url 'accounts:logout' %}" class="btn btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-2"></i>退出登录
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
