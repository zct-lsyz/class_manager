{% extends "base.html" %}
{% block title %}编辑纪律条目{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 mb-4">
    <h4 class="mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>编辑纪律条目</h4>
    <a href="{% if item.module == 'classroom_discipline' %}{% url 'discipline:classroom_items' %}{% else %}{% url 'discipline:dorm_items' %}{% endif %}" class="btn btn-outline-secondary btn-sm">返回</a>
</div>
<form method="post" class="card p-4">
    {% csrf_token %}
    <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
        </div>
        {% endfor %}
    </div>
    <div class="mt-3"><button class="btn btn-primary">保存修改</button></div>
</form>
{% endblock %}
