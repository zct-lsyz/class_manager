{% load static %}
{% if students_json %}{{ students_json|json_script:"scs-students-data" }}{% endif %}
{% if initial_selected %}{{ initial_selected|json_script:"scs-initial-data" }}{% endif %}
<div class="mb-3">
    <label class="form-label small">{{ field.label }}（可多选）</label>
    <button type="button" class="btn btn-outline-secondary btn-sm" id="scsButton">选择学生</button>
    <div class="border rounded mt-1 bg-white p-2 d-none" id="scsPanel" style="max-width:380px;"></div>
    <div class="d-flex flex-wrap gap-1 mt-1" id="scsSummary"></div>
    <input type="hidden" name="student_mode" id="scsMode" value="one">
    {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
</div>
<script src="{% static 'js/student-checkbox-select.js' %}"></script>
<script>
(function() {
    const el = document.getElementById('scs-students-data');
    if (!el) return;
    const students = JSON.parse(el.textContent);
    const initialEl = document.getElementById('scs-initial-data');
    initStudentCheckboxSelect({
        buttonId: 'scsButton', panelId: 'scsPanel', summaryId: 'scsSummary',
        studentsName: '{{ students_name|default:"students" }}', staticStudents: students,
        initialSelected: initialEl ? JSON.parse(initialEl.textContent) : [],
        modeId: 'scsMode',
    });
})();
</script>
