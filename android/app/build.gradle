plugins {
    id 'com.android.application'
}

android {
    namespace 'com.classmanager.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.classmanager.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Kotlin BOM：把所有 Kotlin 构件统一到 1.8.22。
    // 从 Kotlin 1.8.0 起，kotlin-stdlib-jdk7/jdk8 的内容已合并进 kotlin-stdlib，
    // 这两个旧构件在 1.8.x 只是空壳（重定向到 stdlib）。
    // 不统一版本会导致同时拉入 stdlib 1.8.22 和 jdk7/jdk8 1.6.0，出现重复类冲突；
    // 同时也不要手动 exclude 它们，否则会触发 AGP alignWith 的
    // "Cannot mutate ... after the configuration was resolved" 崩溃。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
