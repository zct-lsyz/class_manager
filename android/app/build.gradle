plugins {
    id 'com.android.application'
}

def xiaomiAppId = System.getenv("XIAOMI_PUSH_APP_ID") ?: ""
def xiaomiAppKey = System.getenv("XIAOMI_PUSH_APP_KEY") ?: ""

android {
    namespace 'com.classmanager.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.classmanager.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "2.3.0"
        buildConfigField "String", "API_BASE_URL", '"https://120.27.231.112/api/v1/"'
        buildConfigField "String", "XIAOMI_APP_ID", '"' + xiaomiAppId + '"'
        buildConfigField "String", "XIAOMI_APP_KEY", '"' + xiaomiAppKey + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    //noinspection GradleDependency -- 2.10+ requires compileSdk 35; this project intentionally remains on 34.
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    if (file('libs/MiPush_SDK_Client.aar').exists()) {
        implementation files('libs/MiPush_SDK_Client.aar')
    }
}
