# =====================================
# 班级教学管理平台 - Docker Compose
# =====================================

services:
  nginx:
    image: nginx:stable-alpine
    container_name: classroom-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    container_name: classroom-web
    expose:
      - "8000"
    volumes:
      - data:/app/data
      - media:/app/media
      - backups:/app/backups
      - exports:/app/exports
      - logs:/app/logs
      - staticfiles:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear && exec gunicorn config.wsgi:application --bind=0.0.0.0:8000 --workers=2 --timeout=300 --access-logfile=/app/logs/gunicorn_access.log --error-logfile=/app/logs/gunicorn_error.log"

  backup-scheduler:
    build: .
    container_name: classroom-backup-scheduler
    volumes:
      - data:/app/data
      - media:/app/media
      - backups:/app/backups
      - logs:/app/logs
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      - web
    restart: unless-stopped
    command: python manage.py run_backup_scheduler

volumes:
  data:
  media:
  backups:
  exports:
  logs:
  staticfiles:
